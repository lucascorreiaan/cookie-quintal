<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Cookie Quintal"><meta name="theme-color" content="#9cc3f0"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cookie no Quintal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Baloo 2 guardada localmente para funcionar offline */
  @font-face { font-family: "Baloo 2"; font-style: normal; font-weight: 400 800; font-display: swap;
    src: url(baloo2-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: "Baloo 2"; font-style: normal; font-weight: 400 800; font-display: swap;
    src: url(baloo2-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

<style>
  /* Layout: ecrã inteiro com o quintal 3D; botões grandes a flutuar por cima (alvo mínimo 64px para dedos pequenos).
     Visual único (dia de sol), sem modo escuro: é um brinquedo, não um documento. */
  :root {
    --ink: #22314a;
    --ink-soft: #55657e;
    --paper: #ffffff;
    --paper-tint: #fff7e6;
    --sun: #ffbe2e;
    --berry: #f0567a;
    --sky: #9cc3f0;
    --leaf: #47b05a;
    --shadow: 0 10px 30px rgba(20, 35, 60, .22);
    --font: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body { background: var(--sky); color: var(--ink); font-family: var(--font); overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #app { position: relative; height: 100%; overflow: hidden; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  button { font-family: var(--font); color: var(--ink); -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 4px solid var(--berry); outline-offset: 3px; }

  /* barra de cima */
  .top { position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    display: flex; align-items: center; justify-content: space-between; gap: 10px; pointer-events: none; }
  .round { pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--paper);
    box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; flex: none; }
  .round svg { width: 32px; height: 32px; }
  .round:active { transform: scale(.94); }
  .stars { display: flex; gap: 4px; background: rgba(255,255,255,.88); padding: 8px 14px; border-radius: 999px; box-shadow: var(--shadow); }
  .stars svg { width: 34px; height: 34px; transition: transform .35s cubic-bezier(.3,1.8,.5,1); }
  .stars svg.on { transform: scale(1.18); }
  [hidden] { display: none !important; }

  /* balão do pedido */
  #bubble { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    max-width: min(92%, 640px); display: flex; align-items: center; gap: 14px; background: var(--paper);
    border-radius: 28px; padding: 12px 14px 12px 12px; box-shadow: var(--shadow); cursor: pointer; border: 0; text-align: left; }
  #bubble .ic { flex: none; width: 76px; height: 76px; border-radius: 20px; background: var(--paper-tint); display: grid; place-items: center; }
  #bubble .ic svg { width: 64px; height: 64px; }
  #bubble .tx { font-size: clamp(20px, 3.4vw, 30px); font-weight: 700; line-height: 1.15; min-width: 0; }
  #bubble .spk { flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--sun); display: grid; place-items: center; }
  #bubble .spk svg { width: 28px; height: 28px; }
  #bubble.pulse { animation: pulse .5s ease; }
  @keyframes pulse { 50% { transform: translateX(-50%) scale(1.05); } }

  /* menu */
  .panel { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: none; }
  .card { pointer-events: auto; background: rgba(255,255,255,.94); border-radius: 36px; box-shadow: var(--shadow);
    padding: 22px clamp(16px, 4vw, 34px) 26px; width: min(100%, 760px); text-align: center; }
  .card h1 { margin: 0; font-size: clamp(34px, 7vw, 60px); line-height: 1; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
  .card h1 span { color: var(--berry); }
  .card p.sub { margin: 6px 0 18px; font-size: clamp(16px, 2.6vw, 21px); color: var(--ink-soft); font-weight: 500; }
  .acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 2.5vw, 18px); }
  .act { border: 0; border-radius: 28px; padding: 14px 8px 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px;
    box-shadow: inset 0 -6px 0 rgba(0,0,0,.08); transition: transform .15s; }
  .act:active { transform: scale(.95); }
  .act svg { width: min(100%, 120px); height: auto; aspect-ratio: 1; }
  .act b { font-size: clamp(20px, 3.6vw, 30px); font-weight: 800; }
  .act.c1 { background: #ffe3ea; } .act.c2 { background: #e2f0ff; } .act.c3 { background: #e5f6e4; }
  .hint { margin: 16px 0 0; font-size: 14px; color: var(--ink-soft); }
  .btns { display: flex; justify-content: center; gap: 16px; margin-top: 18px; flex-wrap: wrap; }
  .big { border: 0; border-radius: 999px; padding: 12px 26px; font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px;
    cursor: pointer; box-shadow: inset 0 -5px 0 rgba(0,0,0,.12); min-height: 64px; }
  .big svg { width: 30px; height: 30px; }
  .big.y { background: var(--sun); } .big.w { background: #eef2f7; }
  .bigstars { display: flex; justify-content: center; gap: 6px; margin: 10px 0 0; }
  .bigstars svg { width: clamp(40px, 9vw, 64px); height: auto; animation: pop .6s cubic-bezier(.3,1.8,.5,1) both; }
  @keyframes pop { from { transform: scale(0) rotate(-40deg); } }
  #done { align-items: start; padding-top: calc(88px + env(safe-area-inset-top, 0px)); }
  #done .card { width: min(100%, 520px); padding-bottom: 20px; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 700; color: var(--ink); }

  @media (max-width: 520px) {
    .acts { gap: 8px; }
    .act { border-radius: 22px; padding: 10px 4px; }
    #bubble .ic { width: 60px; height: 60px; } #bubble .ic svg { width: 50px; height: 50px; }
    .stars svg { width: 26px; height: 26px; }
    .round { width: 56px; height: 56px; }
  }
  @media (prefers-reduced-motion: reduce) { .bigstars svg, #bubble.pulse { animation: none; } }
</style>

<div id="app">

  <div class="loading" id="loading">A chamar o Cookie…</div>

  <div class="top">
    <button class="round" id="homeBtn" aria-label="Menu" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="#22314a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/></svg>

          <b>Cores</b>

          <b>Números</b>

          <svg viewBox="0 0 100 100"><circle cx="28" cy="34" r="16" fill="#f97316"/><rect x="56" y="18" width="30" height="30" rx="3" fill="#8b5cf6"/><path d="M50 56 L70 88 L30 88 Z" fill="#22a35a"/></svg>
          <b>Formas</b>

        <button class="big w" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="#22314a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3 11l9-7 9 7"/><path d="M5.5 9.5V20h13V9.5"/></svg>Jogos</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from "./three.module.min.js";

const COLORS = {
  solar: "#ffc53d",
  grid: "#5aa9ff",
  export: "#ffc53d",
  ev: "#3ddc84",
  battery: "#ff9f43",
  home: "#ffffff",
};

function buildScene(THREE) {
  const scene = new THREE.Scene();
  const root = new THREE.Group();
  scene.add(root);

  /* ---------- texturas procedurais ---------- */
  const canvasTex = (size, draw, rx = 1, ry = 1, srgb = true) => {
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    draw(g, size);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx, ry);
    if (srgb) t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 4;
    return t;
  };
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

  const pavingTex = (rx, ry) => canvasTex(256, (g, s) => {
    g.fillStyle = "#9c9fa2"; g.fillRect(0, 0, s, s);
    const tw = s / 2, th = s / 4;
    for (let r = 0; r < 4; r++) for (let c = -1; c < 3; c++) {
      const off = (r % 2) * tw / 2;
      const v = 150 + Math.floor(rnd() * 22);
      g.fillStyle = `rgb(${v},${v + 2},${v + 5})`;
      g.fillRect(c * tw + off + 2, r * th + 2, tw - 4, th - 4);
    }
  }, rx, ry);

  const grassTex = (rx, ry) => canvasTex(256, (g, s) => {
    g.fillStyle = "#5ea832"; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 4000; i++) {
      const v = rnd();
      g.fillStyle = v > .5 ? "rgba(120,190,70,.55)" : "rgba(50,110,30,.5)";
      g.fillRect(rnd() * s, rnd() * s, 1.5, 3);
    }
  }, rx, ry);

  const stoneTex = canvasTex(256, (g, s) => {
    g.fillStyle = "#ddd3c1"; g.fillRect(0, 0, s, s);
    const th = s / 8;
    for (let r = 0; r < 8; r++) {
      let x = (r % 2) * -40;
      while (x < s) {
        const w = 60 + rnd() * 70;
        const v = 205 + Math.floor(rnd() * 25);
        g.fillStyle = `rgb(${v},${v - 6},${v - 18})`;
        g.fillRect(x + 1.5, r * th + 1.5, w - 3, th - 3);
        x += w;
      }
    }
  }, 2, 1.5);

  const panelTex = canvasTex(256, (g, s) => {
    g.fillStyle = "#14243b"; g.fillRect(0, 0, s, s);
    const cw = s / 10, ch = s / 6;
    for (let i = 0; i < 10; i++) for (let j = 0; j < 6; j++) {
      g.fillStyle = "#1b3354"; g.fillRect(i * cw + 1.5, j * ch + 1.5, cw - 3, ch - 3);
    }
    g.strokeStyle = "#9fb0c2"; g.lineWidth = 6; g.strokeRect(0, 0, s, s);
  });

  const shutterTex = canvasTex(64, (g, s) => {
    g.fillStyle = "#24282e"; g.fillRect(0, 0, s, s);
    g.fillStyle = "#30353c";
    for (let y = 0; y < s; y += 8) g.fillRect(0, y, s, 4);
  }, 1, 4);

  const glowTex = canvasTex(64, (g, s) => {
    const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(.25, "rgba(255,255,255,.55)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, s, s);
  });

  /* ---------- materiais ---------- */
  const M = {
    white: new THREE.MeshStandardMaterial({ color: "#f3f3f0", roughness: .92 }),
    whiteShade: new THREE.MeshStandardMaterial({ color: "#e2e2de", roughness: .95 }),
    cap: new THREE.MeshStandardMaterial({ color: "#d6d6d2", roughness: .9 }),
    neighbor: new THREE.MeshStandardMaterial({ color: "#d9d9d5", roughness: .95 }),
    frame: new THREE.MeshStandardMaterial({ color: "#555a61", roughness: .75 }),
    dark: new THREE.MeshStandardMaterial({ color: "#23272c", roughness: .55, metalness: .3 }),
    door: new THREE.MeshStandardMaterial({ color: "#1a1a1c", roughness: .5 }),
    stone: new THREE.MeshStandardMaterial({ color: "#ffffff", map: stoneTex, roughness: .95 }),
    wood: new THREE.MeshStandardMaterial({ color: "#9b6a3a", roughness: .7 }),
    shutter: new THREE.MeshStandardMaterial({ map: shutterTex, roughness: .6 }),
    railGlass: new THREE.MeshStandardMaterial({ color: "#cfe6f5", transparent: true, opacity: .28, roughness: .05, metalness: .2 }),
    winGround: new THREE.MeshStandardMaterial({ color: "#1d2834", roughness: .12, metalness: .55, emissive: "#ffc56e", emissiveIntensity: 0 }),
    winFirst: new THREE.MeshStandardMaterial({ color: "#1d2834", roughness: .12, metalness: .55, emissive: "#ffc56e", emissiveIntensity: 0 }),
    winNeighbor: new THREE.MeshStandardMaterial({ color: "#26303b", roughness: .2, metalness: .4, emissive: "#ffcf87", emissiveIntensity: 0 }),
    interior: new THREE.MeshStandardMaterial({ color: "#d9dad6", roughness: .95 }),
    floorDark: new THREE.MeshStandardMaterial({ color: "#3b3e43", roughness: .8 }),
    panel: new THREE.MeshStandardMaterial({ map: panelTex, roughness: .25, metalness: .5 }),
    alu: new THREE.MeshStandardMaterial({ color: "#b8bec5", roughness: .4, metalness: .7 }),
    tank: new THREE.MeshStandardMaterial({ color: "#eceeef", roughness: .35, metalness: .4 }),
    carPaint: new THREE.MeshStandardMaterial({ color: "#d3d8de", roughness: .28, metalness: .65 }),
    carGlass: new THREE.MeshStandardMaterial({ color: "#0e1318", roughness: .1, metalness: .6 }),
    rubber: new THREE.MeshStandardMaterial({ color: "#121314", roughness: .9 }),
    headlight: new THREE.MeshStandardMaterial({ color: "#f4fbff", emissive: "#dff2ff", emissiveIntensity: .6 }),
    device: new THREE.MeshStandardMaterial({ color: "#f5f5f5", roughness: .5 }),
    led: new THREE.MeshBasicMaterial({ color: "#3ddc84" }),
    grassMat: new THREE.MeshStandardMaterial({ map: grassTex(8, 12), roughness: 1 }),
    grassFront: new THREE.MeshStandardMaterial({ map: grassTex(6, 4), roughness: 1 }),
    grassSide: new THREE.MeshStandardMaterial({ map: grassTex(2, 6), roughness: 1 }),
    paving: new THREE.MeshStandardMaterial({ map: pavingTex(11, 25), roughness: .9 }),
    driveway: new THREE.MeshStandardMaterial({ map: pavingTex(2.5, 58), roughness: .9 }),
    pavingFront: new THREE.MeshStandardMaterial({ map: pavingTex(2, 14), roughness: .9 }),
    ground: new THREE.MeshStandardMaterial({ color: "#8e9585", roughness: 1 }),
    road: new THREE.MeshStandardMaterial({ color: "#5d6064", roughness: .95 }),
    leaf: new THREE.MeshStandardMaterial({ color: "#3f7a33", roughness: .9, flatShading: true }),
    trunk: new THREE.MeshStandardMaterial({ color: "#6b4b33", roughness: .9 }),
    beige: new THREE.MeshStandardMaterial({ color: "#cdb89a", roughness: .8 }),
    playWall: new THREE.MeshStandardMaterial({ color: "#dfe7dc", roughness: .9 }),
    playRoof: new THREE.MeshStandardMaterial({ color: "#8fa2ac", roughness: .8 }),
    slide: new THREE.MeshStandardMaterial({ color: "#6f8f8a", roughness: .6 }),
    net: new THREE.MeshStandardMaterial({ color: "#1d2023", transparent: true, opacity: .35, roughness: .9, side: THREE.DoubleSide }),
    pylon: new THREE.MeshStandardMaterial({ color: "#8a9096", roughness: .6, metalness: .5 }),
    garageDoor: new THREE.MeshStandardMaterial({ color: "#5a5f67", roughness: .6, metalness: .2 }),
  };

  /* ---------- auxiliares ---------- */
  const box = (x0, x1, y0, y1, z0, z1, mat, parent = root, shadow = true) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
    m.castShadow = shadow; m.receiveShadow = true;
    parent.add(m);
    return m;
  };
  const flat = (x0, x1, z0, z1, y, mat) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set((x0 + x1) / 2, y, (z0 + z1) / 2);
    m.receiveShadow = true;
    root.add(m);
    return m;
  };
  const beam = (a, b, r, mat) => {
    const d = new THREE.Vector3().subVectors(b, a);
    const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 5), mat);
    m.position.copy(a).addScaledVector(d, .5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
    m.castShadow = true;
    root.add(m);
    return m;
  };

  /* ---------- terreno ---------- */
  const groundPlane = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), M.ground);
  groundPlane.rotation.x = -Math.PI / 2;
  groundPlane.position.y = -0.02;
  groundPlane.receiveShadow = true;
  root.add(groundPlane);
  flat(-60, 60, 22.5, 29, -0.01, M.road);                 // rua
  flat(-3.5, 9.5, 13, 21, 0.01, M.grassFront);            // relvado da frente
  flat(-6.5, -3.5, -14, 21, 0.02, M.driveway);            // entrada lateral do carro
  flat(0.6, 1.8, 13, 21, 0.025, M.pavingFront);           // caminho até à porta
  flat(-3.5, 6.0, 13, 14, 0.025, M.pavingFront);          // passeio junto à fachada
  flat(6.0, 9.5, 1, 13, 0.01, M.grassSide);               // corredor lateral (relva)
  flat(-3.5, 9.5, -14, 1, 0.01, M.paving);                // pátio
  flat(3.0, 9.5, -14, 0.6, 0.03, M.grassMat);             // relva do pátio

  /* ---------- muros e portões ---------- */
  box(9.5, 9.7, 0, 2.0, -14.4, 21, M.white);              // muro direito
  box(-6.7, -6.5, 0, 2.0, -14, 21, M.white);              // muro esquerdo (lado da entrada)
  box(6.5, 9.7, 0, 1.6, -14.4, -14.2, M.white);           // muro do fundo, lado da relva
  box(-3.5, 0.6, 0, .9, 20.8, 21, M.white);
  box(1.8, 9.5, 0, .9, 20.8, 21, M.white);
  box(0.6, 1.8, 0, 1.1, 20.85, 20.95, M.dark);            // portão pedonal
  box(-3.5, -3.2, 0, 1.8, 20.75, 21.05, M.white);         // pilar do portão

function updateDog(dt, t) {

function shape2D(key, s = 1) {
  const sh = new THREE.Shape();
  if (key === "circulo") sh.absarc(0, 0, .36 * s, 0, Math.PI * 2, false);
  else if (key === "quadrado") { const a = .32 * s; sh.moveTo(-a, -a); sh.lineTo(a, -a); sh.lineTo(a, a); sh.lineTo(-a, a); sh.closePath(); }
  else if (key === "triangulo") { sh.moveTo(0, .4 * s); sh.lineTo(-.4 * s, -.3 * s); sh.lineTo(.4 * s, -.3 * s); sh.closePath(); }
  else if (key === "estrela") {
    for (let i = 0; i < 10; i++) {
      const r = (i % 2 ? .18 : .42) * s, a = Math.PI / 2 + i * Math.PI / 5;
      i ? sh.lineTo(Math.cos(a) * r, Math.sin(a) * r) : sh.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    sh.closePath();
  } else if (key === "coracao") {
    const k = .021 * s;
    sh.moveTo(0, -14 * k);
    sh.bezierCurveTo(-4 * k, -10 * k, -18 * k, -2 * k, -18 * k, 6 * k);
    sh.bezierCurveTo(-18 * k, 14 * k, -8 * k, 18 * k, 0, 10 * k);
    sh.bezierCurveTo(8 * k, 18 * k, 18 * k, 14 * k, 18 * k, 6 * k);
    sh.bezierCurveTo(18 * k, -2 * k, 4 * k, -10 * k, 0, -14 * k);
  }
  return sh;
}

const items = [];

function clearItems() { for (const it of items) scene.remove(it.group); items.length = 0; dog.carry = null; }

function updateItems(dt, t) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];

    if (it.state === "spawn") {

    }
  }
}

}

    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.32, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + .17);
    o.connect(lp).connect(g).connect(a.destination); o.start(t); o.stop(t + .2);

let voice = null;

}

  try {
    speechSynthesis.cancel();

/* ---------- ícones ---------- */
const starSvg = (on) => `<svg viewBox="0 0 24 24" class="${on ? "on" : ""}"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on ? "#ffbe2e" : "#e4e9f0"}" stroke="${on ? "#e09a00" : "#c9d2de"}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
const ballIcon = (hex) => `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="${hex}"/><path d="M8 38c14-6 34-6 48 0" stroke="#fff" stroke-width="4" fill="none" opacity=".9"/><circle cx="23" cy="22" r="6" fill="#fff" opacity=".45"/></svg>`;
function shapeIcon(key, hex) {
  const p = {
    circulo: '<circle cx="32" cy="32" r="24"/>',
    quadrado: '<rect x="10" y="10" width="44" height="44" rx="4"/>',
    triangulo: '<path d="M32 7 L58 54 H6 Z"/>',
    estrela: '<path d="M32 4l7.6 16.6 18 2-13.4 12.3 3.8 17.9L32 43.6l-16 9.2 3.8-17.9L6.4 22.6l18-2z"/>',
    coracao: '<path d="M32 56C10 40 4 30 4 20 4 11 11 5 19 5c6 0 10 3 13 8 3-5 7-8 13-8 8 0 15 6 15 15 0 10-6 20-28 36z"/>',
  }[key];
  return `<svg viewBox="0 0 64 64" fill="${hex}">${p}</svg>`;
}
function countIcon(n, done) {
  const cols = n <= 3 ? n : 3, rows = Math.ceil(n / 3);
  let s = `<svg viewBox="0 0 64 64"><text x="32" y="${n > 3 ? 27 : 31}" text-anchor="middle" font-family="Baloo 2, Trebuchet MS, sans-serif" font-weight="800" font-size="${n > 3 ? 26 : 32}" fill="#3b82f6">${n}</text>`;
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / 3), c = i % 3, inRow = r < rows - 1 ? 3 : n - r * 3;
    const x = 32 + (c - (inRow - 1) / 2) * 17, y = (n > 3 ? 40 : 48) + r * 15;
    s += `<circle cx="${x}" cy="${y}" r="6.5" fill="${i < done ? "#c98d4e" : "#fff"}" stroke="#c98d4e" stroke-width="2.5"/>`;
  }
  return s + "</svg>";
}

/* ---------- UI ---------- */
const bubble = $("#bubble"), bIcon = $("#bIcon"), bText = $("#bText");
const starsEl = $("#stars"), menuEl = $("#menu"), doneEl = $("#done"), homeBtn = $("#homeBtn");
let promptText = "", promptAt = 0, promptRepeated = false;
function showPrompt(text, icon, speak = text) {
  promptText = speak; promptAt = performance.now(); promptRepeated = false;
  bText.textContent = text; bIcon.innerHTML = icon;
  bubble.hidden = false;
  bubble.classList.remove("pulse"); void bubble.offsetWidth; bubble.classList.add("pulse");
  say(speak);
}
bubble.addEventListener("click", () => { audio(); say(promptText); bubble.classList.remove("pulse"); void bubble.offsetWidth; bubble.classList.add("pulse"); });

const ROUNDS = 5;
let mode = "menu", activity = null, round = 0, stars = 0, busy = false, want = null, need = 0, count = 0;
function renderStars() { starsEl.innerHTML = Array.from({ length: ROUNDS }, (_, i) => starSvg(i < stars)).join(""); }

const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const PRAISE = ["Boa!", "Muito bem!", "Isso mesmo!", "Fantástico!", "Que bom!", "Espetacular!"];

const tmp3 = new THREE.Vector3();
function onScreen([x, z]) {
  tmp3.set(x, .4, z).project(camera);
  return Math.abs(tmp3.x) < .84 && tmp3.y > -.6 && tmp3.y < .74;
}
function freeSlots(n) {
  const near = ([x, z]) => Math.hypot(x - dog.pos.x, z - dog.pos.z) > 1.6;
  let pool = SLOTS.filter((s) => onScreen(s) && near(s));
  if (pool.length < n) pool = pool.concat(shuffle(SLOTS.filter((s) => !pool.includes(s) && near(s))));
  return shuffle(pool.slice(0, Math.max(n, pool.length))).slice(0, n);
}

function goMenu() {
  mode = "menu"; activity = null; busy = false;
  clearItems();
  bubble.hidden = true; starsEl.hidden = true; homeBtn.hidden = true; doneEl.hidden = true; menuEl.hidden = false;
  try { speechSynthesis.cancel(); } catch (e) {}
}
function startActivity(a) {
  audio();
  activity = a; round = 0; stars = 0; renderStars();
  menuEl.hidden = true; doneEl.hidden = true; starsEl.hidden = false; homeBtn.hidden = false;
  mode = "play";
  runTo(HOME.x, HOME.z, null, .1, 4.5);
  setTimeout(nextRound, 350);
}
document.querySelectorAll(".act").forEach((b) => b.addEventListener("click", () => startActivity(b.dataset.a)));
homeBtn.addEventListener("click", goMenu);
$("#menuBtn").addEventListener("click", goMenu);
$("#againBtn").addEventListener("click", () => startActivity(activity));

function nextRound() {
  if (mode !== "play") return;
  clearItems(); busy = false;
  if (round >= ROUNDS) return finale();
  round++;
  if (activity === "cores") {
    const n = round <= 2 ? 3 : 4;
    const pool = shuffle(COLORS_PT).slice(0, n);
    want = pick(pool);
    freeSlots(n).forEach((s, i) => addItem("ball", pool[i], s));
    showPrompt(`O Cookie quer a bola ${want.key}!`, ballIcon(want.hex));
  } else if (activity === "numeros") {
    const ranges = [[1, 2], [2, 3], [2, 4], [3, 5], [3, 5]];
    const [lo, hi] = ranges[round - 1];
    need = lo + Math.floor(Math.random() * (hi - lo + 1)); count = 0;
    const total = Math.min(need + 2, 7);
    freeSlots(total).forEach((s) => addItem("biscuit", {}, s));
    const word = need === 1 ? "biscoito" : "biscoitos";
    showPrompt(`Dá ${need} ${word} ao Cookie!`, countIcon(need, 0), `Dá ${NUM[need]} ${word} ao Cookie!`);
  } else {
    const n = round <= 2 ? 3 : 4;
    const pool = shuffle(SHAPES).slice(0, n);
    const cols = shuffle(SHAPE_COLORS);
    const data = pool.map((s, i) => ({ ...s, hex: cols[i] }));
    want = pick(data);
    freeSlots(n).forEach((s, i) => addItem("shape", data[i], s));
    showPrompt(`O Cookie quer ${want.o}!`, shapeIcon(want.key, want.hex));
  }
}

function celebrate(text, big = false) {
  jump(big ? 3 : 2); woof(); chime();
  stars++; renderStars();
  say(text);
  confetti(big ? 220 : 70);
}

function fetchItem(it, praise) {
  busy = true; pop();
  it.state = "target";
  runTo(it.group.position.x, it.group.position.z, () => {
    it.state = "carried"; dog.carry = it;
    runTo(HOME.x, HOME.z, () => {
      dog.carry = null; it.state = "rest";
      tmp.set(camera.position.x - dog.pos.x, 0, camera.position.z - dog.pos.z).normalize();
      it.group.position.set(dog.pos.x + tmp.x * 1.1, 0, dog.pos.z + tmp.z * 1.1);
      celebrate(praise);
      setTimeout(nextRound, 2400);
    }, .15, 4.8);
  }, .55);
}

function tapItem(it) {
  if (mode !== "play" || busy || (it.state !== "idle" && it.state !== "spawn")) return;
  if (it.state === "spawn") { it.state = "idle"; it.group.scale.setScalar(1); }
  audio();
  if (activity === "numeros") {
    busy = true; pop();
    it.state = "target";
    runTo(it.group.position.x, it.group.position.z, () => {
      dog.eatT = 0; crunch(); it.state = "eaten"; it.t = 0;
      count++;
      bIcon.innerHTML = countIcon(need, count);
      say(NUM[count]);
      if (count >= need) {
        setTimeout(() => {
          const word = need === 1 ? "biscoito" : "biscoitos";
          const n = NUM[need].charAt(0).toUpperCase() + NUM[need].slice(1);
          celebrate(`${n} ${word}! ${pick(PRAISE)} O Cookie está cheio!`);
          setTimeout(nextRound, 2600);
        }, 750);
      } else {
        setTimeout(() => { busy = false; }, 500);
      }
    }, .6);
    return;
  }
  if (it.data.key === want.key) {
    const praise = activity === "cores" ? `${pick(PRAISE)} A bola ${want.key}!` : `${pick(PRAISE)} ${want.o.charAt(0).toUpperCase() + want.o.slice(1)}!`;
    fetchItem(it, praise);
  } else {
    it.state = "shake"; it.t = 0; boop(); dog.tiltT = 0;
    if (activity === "cores") say(`Essa bola é ${it.data.key}. Onde está a bola ${want.key}?`);
    else say(`Isso é ${it.data.um}. Onde está ${want.o}?`);
    promptAt = performance.now();
  }
}

function finale() {
  mode = "done"; clearItems();
  bubble.hidden = true;
  $("#bigStars").innerHTML = Array.from({ length: ROUNDS }, (_, i) => starSvg(true).replace("<svg ", `<svg style="animation-delay:${i * .12}s" `)).join("");
  doneEl.hidden = false;
  dog.spinT = 0; jump(3); woof(); chime(); setTimeout(chime, 450);
  confetti(260);
  say("Parabéns! Ganhaste cinco estrelas! O Cookie está muito feliz!");
}

function petDog() {
  if (dog.state === "run" && busy) return;
  audio();
  jump(2); woof();
  if (mode === "menu") say(pick(["Olá! Eu sou o Cookie!", "Au au!", "Vamos brincar?"]));
}

/* ---------- toque ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitPt = new THREE.Vector3();
canvas.addEventListener("pointerdown", (e) => {
  audio();
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const targets = items.filter((i) => i.state === "idle" || i.state === "spawn").map((i) => i.hit);
  targets.push(dogHit);
  const hits = ray.intersectObjects(targets, false);
  if (hits.length) {
    const o = hits[0].object;
    if (o === dogHit) return petDog();
    return tapItem(o.userData.item);
  }
  if (mode === "menu" && ray.ray.intersectPlane(groundPlane, hitPt)) {
    const x = THREE.MathUtils.clamp(hitPt.x, BOUNDS.x0, BOUNDS.x1), z = THREE.MathUtils.clamp(hitPt.z, BOUNDS.z0, BOUNDS.z1);
    runTo(x, z, () => jump(1), .1, 6);
    dog.idleFor = -3;
  }
});

/* ---------- confetes ---------- */
const fctx = fx.getContext("2d");
let parts = [];
function confetti(n) {
  if (reduceMotion) n = Math.min(n, 30);
  const w = fx.width, h = fx.height, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cols = ["#ef4444", "#3b82f6", "#facc15", "#22a35a", "#f472b6", "#f97316", "#8b5cf6"];
  for (let i = 0; i < n; i++) {
    parts.push({ x: w * (.2 + Math.random() * .6), y: h * (.25 + Math.random() * .2), vx: (Math.random() - .5) * 900 * dpr, vy: (-300 - Math.random() * 700) * dpr,
      r: Math.random() * 6, vr: (Math.random() - .5) * 14, s: (6 + Math.random() * 7) * dpr, c: pick(cols), life: 2.6 + Math.random() });
  }
}
function updateFx(dt) {
  const w = fx.width, h = fx.height;
  fctx.clearRect(0, 0, w, h);
  if (!parts.length) return;
  const g = 1400 * Math.min(window.devicePixelRatio || 1, 2);
  parts = parts.filter((p) => (p.life -= dt) > 0 && p.y < h + 40);
  for (const p of parts) {
    p.vy += g * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c;
    fctx.globalAlpha = Math.min(1, p.life); fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fctx.restore();
  }
}

/* ---------- câmara / tamanho ---------- */
function camOk(c) {
  // a casa (telhado z=1, y≈6.9) e a varanda (z=-0.6, y≈4.1) não podem tapar o chão em z=-4.2
  if (c.z <= .5) return true;
  const yAt = (z) => c.y * (z - -4.2) / (c.z - -4.2);
  return yAt(1) > 7.1 && yAt(-.6) > 4.3;
}
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  fx.width = Math.round(w * dpr); fx.height = Math.round(h * dpr);
  camera.aspect = w / h;
  const portrait = camera.aspect < 1;
  camera.fov = portrait ? 50 : 44;
  const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  if (portrait) {
    // telemóvel na vertical: ver o quintal de lado (a partir do muro direito), que é mais estreito
    camTarget.set(2.6, 0, -8.4);
    const d = Math.max(4.9 / (halfH * camera.aspect), 11);
    camera.position.copy(camTarget).addScaledVector(new THREE.Vector3(1, 1.45, 0).normalize(), d);
  } else {
    const d = Math.max(7.2 / (halfH * camera.aspect), 13);
    camTarget.set(2.8, 0, -7.6);
    for (const k of [1.25, 1.6, 2.1, 2.8, 4, 8]) {
      const dir = new THREE.Vector3(0, k, 1).normalize();
      camera.position.copy(camTarget).addScaledVector(dir, d);
      if (camOk(camera.position)) break;
    }
  }
  camera.lookAt(camTarget);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(app);
resize();

/* ---------- ciclo ---------- */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  if (mode === "menu" && dog.state === "idle" && dog.idleFor > 2.8) {
    const vis = SLOTS.filter(onScreen);
    const [x, z] = pick(vis.length ? vis : SLOTS);
    runTo(x, z, null, .3, 3.6);
  }
  if (mode === "play" && !busy && !promptRepeated && now - promptAt > 12000) {
    promptRepeated = true; say(promptText);
    bubble.classList.remove("pulse"); void bubble.offsetWidth; bubble.classList.add("pulse");
  }
  updateDog(dt, t);
  updateItems(dt, t);
  renderer.render(scene, camera);
  updateFx(dt);
}
$("#loading").remove();
requestAnimationFrame(loop);
</script>

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
